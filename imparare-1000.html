<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Parole!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #1a0533;
  --card: #2a1045;
  --c1: #ff6b9d; --c1d: #c94d7a;
  --c2: #ffd93d; --c2d: #c9a800;
  --c3: #6bcb77; --c3d: #3d9647;
  --c4: #4d96ff; --c4d: #1a5fcc;
  --c5: #ff9f43; --c5d: #cc6e00;
  --gold: #ffd93d;
  --text: #fff;
  --muted: rgba(255,255,255,0.5);
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  user-select: none;
}

/* ── BG ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse at 30% 0%, rgba(255,107,157,0.25) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 100%, rgba(77,150,255,0.2) 0%, transparent 55%),
    radial-gradient(ellipse at 10% 80%, rgba(107,203,119,0.15) 0%, transparent 45%);
}

#app {
  position: relative; z-index: 1;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center;
  max-width: 480px;
  margin: 0 auto;
  padding: 0 16px 16px;
}

/* ── TOP BAR ── */
.topbar {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0 10px;
  gap: 12px;
}

.hearts {
  display: flex; gap: 5px;
  min-width: 80px;
}
.heart {
  font-size: 1.3rem;
  transition: transform 0.2s;
  display: inline-block;
}
.heart.lost {
  filter: grayscale(1) opacity(0.3);
  animation: heartLost 0.4s ease;
}
@keyframes heartLost {
  0% { transform: scale(1.3); }
  50% { transform: scale(0.7) rotate(-20deg); }
  100% { transform: scale(1); }
}

.score-wrap {
  display: flex; flex-direction: column; align-items: center;
}
.score-num {
  font-size: 1.6rem; font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 12px rgba(255,217,61,0.5);
  line-height: 1;
  transition: transform 0.15s;
}
.score-num.pop { animation: scorePop 0.3s ease; }
@keyframes scorePop {
  0% { transform: scale(1); }
  50% { transform: scale(1.35); }
  100% { transform: scale(1); }
}
.score-lbl { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }

.streak-badge {
  display: flex; align-items: center; gap: 4px;
  background: rgba(255,159,67,0.15);
  border: 1px solid rgba(255,159,67,0.35);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 0.82rem; font-weight: 800;
  color: var(--c5);
  min-width: 60px; justify-content: center;
  transition: all 0.2s;
}
.streak-badge.hot { background: rgba(255,159,67,0.3); border-color: var(--c5); }
.streak-fire { font-size: 1rem; }

/* ── LEVEL PROGRESS ── */
.level-row {
  width: 100%;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 12px;
}
.lv-label {
  font-size: 0.72rem; font-weight: 900;
  color: var(--gold);
  white-space: nowrap;
  min-width: 36px;
}
.lv-bar {
  flex: 1; height: 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 5px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.08);
}
.lv-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--c1), var(--gold));
  border-radius: 5px;
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  position: relative;
}
.lv-fill::after {
  content: '';
  position: absolute; right: 0; top: 0; bottom: 0; width: 8px;
  background: rgba(255,255,255,0.5);
  animation: shine 1.5s ease-in-out infinite;
}
@keyframes shine { 0%,100%{opacity:0} 50%{opacity:1} }
.lv-num {
  font-size: 0.72rem; font-weight: 900;
  color: var(--muted);
  min-width: 28px; text-align: right;
}

.goal-row {
  width: 100%;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-size: 0.78rem;
  margin-bottom: 10px;
  color: var(--muted);
}
.goal-label {
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 800;
}
.goal-num {
  font-weight: 900;
  color: var(--gold);
}

/* ── WORD CARD ── */
.word-card {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  padding: 22px 20px 18px;
  text-align: center;
  margin-bottom: 14px;
  backdrop-filter: blur(10px);
  position: relative;
  overflow: hidden;
  transition: transform 0.15s;
  flex-shrink: 0;
}
.word-card.shake { animation: cardShake 0.4s ease; }
@keyframes cardShake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(6px)}
}
.word-card.celebrate { animation: cardPop 0.35s cubic-bezier(0.175,0.885,0.32,1.275); }
@keyframes cardPop {
  0%{transform:scale(1)}
  50%{transform:scale(1.04)}
  100%{transform:scale(1)}
}

.cat-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 0.62rem; font-weight: 800; letter-spacing: 0.12em;
  text-transform: uppercase; padding: 3px 9px; border-radius: 20px;
  margin-bottom: 12px;
}
.sentence-display {
  font-size: clamp(1.15rem, 4.5vw, 1.5rem);
  font-weight: 800;
  line-height: 1.5;
  margin-bottom: 10px;
  letter-spacing: -0.01em;
}
.blank {
  display: inline-block;
  background: rgba(255,255,255,0.15);
  border-bottom: 3px solid var(--gold);
  border-radius: 4px;
  padding: 1px 12px;
  color: var(--gold);
  font-style: italic;
  min-width: 70px;
  text-align: center;
  animation: blankPulse 2s ease-in-out infinite;
}
@keyframes blankPulse {
  0%,100% { border-color: var(--gold); box-shadow: none; }
  50% { border-color: #fff; box-shadow: 0 2px 8px rgba(255,217,61,0.4); }
}
.blank.filled {
  animation: none;
  background: rgba(107,203,119,0.25);
  border-color: var(--c3);
  color: var(--c3);
}
.blank.filled-wrong {
  animation: none;
  background: rgba(255,107,157,0.18);
  border-color: var(--c1);
  color: var(--c1);
  text-decoration: line-through;
}
.sentence-en {
  font-size: 0.8rem;
  color: var(--muted);
  font-style: italic;
  margin-bottom: 10px;
  line-height: 1.4;
}
.hear-btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.7);
  border-radius: 20px;
  padding: 5px 14px;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  font-size: 0.75rem; font-weight: 700;
  transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 5px;
}
.hear-btn:active { transform: scale(0.94); background: rgba(255,255,255,0.18); }

/* Question type label */
.q-instruction {
  font-size: 0.72rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 800;
  margin-bottom: 8px;
}

/* ── ANSWER TILES ── */
.tiles {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  flex: 1;
}

.tile {
  border: none;
  border-radius: 18px;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  font-size: clamp(0.9rem, 3.5vw, 1.1rem);
  font-weight: 800;
  color: #fff;
  padding: 0 12px;
  height: 72px;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  line-height: 1.2;
  position: relative;
  overflow: hidden;
  transition: transform 0.1s, filter 0.1s;
  box-shadow: 0 6px 0 rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.2);
  -webkit-tap-highlight-color: transparent;
  word-break: break-word;
}
.tile::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 40%;
  background: rgba(255,255,255,0.12);
  border-radius: 18px 18px 50% 50%;
}
.tile:active { transform: scale(0.95) translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); filter: brightness(0.9); }
.tile:disabled { cursor: default; }

.tile.c0 { background: linear-gradient(160deg, var(--c1), var(--c1d)); box-shadow: 0 6px 0 #8a2444, 0 2px 8px rgba(0,0,0,0.2); }
.tile.c1 { background: linear-gradient(160deg, var(--c2), var(--c2d)); box-shadow: 0 6px 0 #8a6d00, 0 2px 8px rgba(0,0,0,0.2); color: #222; }
.tile.c2 { background: linear-gradient(160deg, var(--c3), var(--c3d)); box-shadow: 0 6px 0 #1e5c26, 0 2px 8px rgba(0,0,0,0.2); }
.tile.c3 { background: linear-gradient(160deg, var(--c4), var(--c4d)); box-shadow: 0 6px 0 #0a3480, 0 2px 8px rgba(0,0,0,0.2); }

.tile.correct {
  animation: tileCorrect 0.45s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
  filter: brightness(1.2) !important;
}
@keyframes tileCorrect {
  0%  { transform: scale(1); }
  40% { transform: scale(1.12); }
  70% { transform: scale(0.97); }
  100%{ transform: scale(1.05); }
}
.tile.wrong {
  animation: tileWrong 0.4s ease forwards;
}
@keyframes tileWrong {
  0%,100%{ transform: translateX(0); }
  20%{ transform: translateX(-7px); }
  40%{ transform: translateX(7px); }
  60%{ transform: translateX(-5px); }
  80%{ transform: translateX(5px); }
}
.tile.reveal-correct {
  filter: brightness(1.15) !important;
  outline: 3px solid rgba(255,255,255,0.6);
}
.tile.dimmed { filter: brightness(0.35) saturate(0.3) !important; }

/* ── FEEDBACK OVERLAY ── */
.feedback-overlay {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
}
.feedback-overlay.show { opacity: 1; }
.fb-bubble {
  background: rgba(20,5,40,0.92);
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 24px;
  padding: 20px 32px;
  text-align: center;
  backdrop-filter: blur(12px);
  transform: scale(0.8);
  transition: transform 0.25s cubic-bezier(0.175,0.885,0.32,1.275);
  max-width: 300px;
}
.feedback-overlay.show .fb-bubble { transform: scale(1); }
.fb-emoji { font-size: 2.5rem; line-height: 1; margin-bottom: 4px; }
.fb-word { font-size: 1.05rem; font-weight: 900; margin-bottom: 3px; }
.fb-example { font-size: 0.76rem; color: var(--muted); font-style: italic; line-height: 1.5; margin-top: 5px; max-width: 260px; }

/* ── COMBO BURST ── */
.combo-burst {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 2rem; font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 20px rgba(255,217,61,0.8);
  z-index: 200; pointer-events: none;
  white-space: nowrap;
}
.combo-burst.show {
  animation: comboBurst 0.7s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
}
@keyframes comboBurst {
  0%  { transform: translate(-50%,-50%) scale(0); opacity: 1; }
  50% { transform: translate(-50%,-70%) scale(1.3); opacity: 1; }
  100%{ transform: translate(-50%,-90%) scale(1); opacity: 0; }
}

/* ── FLOATING POINTS ── */
.float-pts {
  position: fixed; pointer-events: none; z-index: 300;
  font-size: 1.4rem; font-weight: 900;
  animation: floatUp 0.9s ease-out forwards;
}
@keyframes floatUp {
  0%  { opacity: 1; transform: translateY(0) scale(1); }
  100%{ opacity: 0; transform: translateY(-70px) scale(1.2); }
}

/* ── CANVAS ── */
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

/* ── GAME OVER / LEVEL UP overlay ── */
.big-overlay {
  position: fixed; inset: 0; z-index: 400;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(20,5,40,0.9); backdrop-filter: blur(12px);
  padding: 24px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
.big-overlay.show { opacity: 1; pointer-events: all; }
.big-icon { font-size: 5rem; margin-bottom: 6px; animation: bigIconPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275) 0.1s both; }
@keyframes bigIconPop { 0%{transform:scale(0) rotate(-20deg)} 100%{transform:scale(1) rotate(0)} }
.big-title { font-size: 2rem; font-weight: 900; margin-bottom: 4px; }
.big-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; text-align: center; line-height: 1.5; }
.big-stats { display: flex; gap: 20px; margin-bottom: 28px; }
.big-stat { text-align: center; }
.big-stat-val { font-size: 1.8rem; font-weight: 900; color: var(--gold); }
.big-stat-lbl { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.big-btn {
  background: linear-gradient(135deg, var(--c1), #ff9f43);
  border: none; border-radius: 18px;
  padding: 16px 48px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem; font-weight: 900;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 6px 0 rgba(0,0,0,0.3);
  transition: all 0.1s;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }

/* ── NEXT BUTTON (shown briefly on correct) ── */
.next-btn {
  width: 100%;
  background: linear-gradient(135deg, #6bcb77, #3d9647);
  border: none; border-radius: 18px;
  padding: 16px;
  font-family: 'Nunito', sans-serif;
  font-size: 1rem; font-weight: 900;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 5px 0 #1e5c26;
  transition: all 0.1s;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-top: 10px;
  display: none;
  flex-shrink: 0;
}
.next-btn.visible { display: block; animation: slideUp 0.3s cubic-bezier(0.175,0.885,0.32,1.275); }
@keyframes slideUp { 0%{transform:translateY(20px);opacity:0} 100%{transform:translateY(0);opacity:1} }
.next-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #1e5c26; }

/* ── SPARKLES ── */
.sparkle {
  position: fixed; pointer-events: none; z-index: 60;
  width: 8px; height: 8px;
  border-radius: 50%;
  animation: sparkleAnim 0.7s ease-out forwards;
}
@keyframes sparkleAnim {
  0%{ transform: scale(0) translate(0,0); opacity:1; }
  100%{ transform: scale(1) translate(var(--tx),var(--ty)); opacity:0; }
}

/* ── WORD TRANSITION ── */
.word-card-inner {
  transition: opacity 0.15s, transform 0.15s;
}
.word-card-inner.exit {
  opacity: 0; transform: scale(0.92);
}
.word-card-inner.enter {
  animation: wordEnter 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
}
@keyframes wordEnter {
  0%{ opacity:0; transform: scale(0.88) translateY(8px); }
  100%{ opacity:1; transform: scale(1) translateY(0); }
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<div id="app">
  <div class="topbar">
    <div class="hearts" id="heartsEl"></div>
    <div class="score-wrap">
      <div class="score-num" id="scoreEl">0</div>
      <div class="score-lbl">score</div>
    </div>
    <div class="streak-badge" id="streakEl">
      <span class="streak-fire">🔥</span>
      <span id="streakNum">0</span>
    </div>
  </div>

  <div class="level-row">
    <div class="lv-label">Lv.<span id="lvNum">1</span></div>
    <div class="lv-bar"><div class="lv-fill" id="lvBar" style="width:0%"></div></div>
    <div class="lv-num"><span id="lvProgress">0</span>/10</div>
  </div>

  <div class="goal-row">
    <div class="goal-label">Words unlocked</div>
    <div class="goal-num" id="goalNum">0 / 1000</div>
  </div>

  <div class="word-card" id="wordCard">
    <div class="word-card-inner" id="cardInner">
      <div class="cat-badge" id="catBadge"></div>
      <div class="q-instruction">Fill in the blank 👇</div>
      <div class="sentence-display" id="sentenceDisplay"></div>
      <div class="sentence-en" id="sentenceEn"></div>
      <button class="hear-btn" id="hearBtn" onclick="speakWord()">
        🔊 <span>Hear sentence</span>
      </button>
    </div>
  </div>

  <div class="tiles" id="tilesEl"></div>
  <button class="next-btn" id="nextBtn" onclick="nextWord()">Continue →</button>
</div>

<!-- Feedback -->
<div class="feedback-overlay" id="fbOverlay">
  <div class="fb-bubble">
    <div class="fb-emoji" id="fbEmoji"></div>
    <div class="fb-word" id="fbWord"></div>
    <div class="fb-example" id="fbExample"></div>
  </div>
</div>

<!-- Combo burst -->
<div class="combo-burst" id="comboBurst"></div>

<!-- Big overlay (game over / level up) -->
<div class="big-overlay" id="bigOverlay">
  <div class="big-icon" id="bigIcon"></div>
  <div class="big-title" id="bigTitle"></div>
  <div class="big-sub" id="bigSub"></div>
  <div class="big-stats" id="bigStats"></div>
  <button class="big-btn" id="bigBtn" onclick="handleBigBtn()">Play Again</button>
</div>

<script>
// ═══════════════════════════════════════════════
// WORDS  [italian, english, pronunciation, category, exampleIT, exampleEN]
// ═══════════════════════════════════════════════
const WORDS = [
["ciao","hello","CHAH-oh","phrase","Ciao! Come stai?","Hello! How are you?"],
["grazie","thank you","GRAH-tsyeh","phrase","Grazie mille!","Thank you very much!"],
["prego","you're welcome","PREH-goh","phrase","Prego, con piacere!","You're welcome, with pleasure!"],
["scusa","sorry","SKOO-zah","phrase","Scusa, ho sbagliato.","Sorry, I was wrong."],
["buongiorno","good morning","bwohn-JOR-noh","phrase","Buongiorno a tutti!","Good morning everyone!"],
["buonanotte","good night","bwoh-nah-NOT-teh","phrase","Buonanotte, dormi bene!","Good night, sleep well!"],
["arrivederci","goodbye","ah-ree-veh-DEHR-chee","phrase","Arrivederci, a presto!","Goodbye, see you soon!"],
["per favore","please","pehr fah-VOH-reh","phrase","Un caffè, per favore.","A coffee, please."],
["mi dispiace","I'm sorry","mee dees-PYAH-cheh","phrase","Mi dispiace molto.","I'm very sorry."],
["benvenuto","welcome","ben-veh-NOO-toh","phrase","Benvenuto in Italia!","Welcome to Italy!"],
["casa","home","KAH-zah","noun","Vado a casa.","I'm going home."],
["vita","life","VEE-tah","noun","La vita è bella.","Life is beautiful."],
["amore","love","ah-MOH-reh","noun","Ti voglio bene, amore.","I love you, my love."],
["uomo","man","WOH-moh","noun","Quell'uomo è gentile.","That man is kind."],
["donna","woman","DON-nah","noun","Quella donna canta.","That woman sings."],
["bambino","child","bahm-BEE-noh","noun","Il bambino ride.","The child laughs."],
["amico","friend","ah-MEE-koh","noun","Sei il mio migliore amico.","You are my best friend."],
["famiglia","family","fah-MEEL-yah","noun","La mia famiglia è grande.","My family is large."],
["padre","father","PAH-dreh","noun","Mio padre cucina bene.","My father cooks well."],
["madre","mother","MAH-dreh","noun","Mia madre è gentile.","My mother is kind."],
["fratello","brother","frah-TEL-loh","noun","Mio fratello è alto.","My brother is tall."],
["sorella","sister","soh-REL-lah","noun","Mia sorella studia.","My sister studies."],
["cane","dog","KAH-neh","noun","Il cane abbaia.","The dog barks."],
["gatto","cat","GAH-toh","noun","Il gatto dorme.","The cat sleeps."],
["mare","sea","MAH-reh","noun","Il mare è blu.","The sea is blue."],
["sole","sun","SOH-leh","noun","Il sole splende.","The sun shines."],
["luna","moon","LOO-nah","noun","La luna è piena.","The moon is full."],
["acqua","water","AHK-kwah","noun","Voglio dell'acqua.","I want some water."],
["pane","bread","PAH-neh","noun","Il pane è fresco.","The bread is fresh."],
["vino","wine","VEE-noh","noun","Il vino è rosso.","The wine is red."],
["caffè","coffee","kahf-FEH","noun","Un caffè, grazie!","A coffee, thanks!"],

// CAT COLOURS
// ═══════════════════════════════════════════════
const CAT_STYLE = {
  noun:  { bg: 'rgba(77,150,255,0.25)',  color: '#6bb5ff', label: '🏷️ Noun' },
  verb:  { bg: 'rgba(107,203,119,0.25)', color: '#6bcb77', label: '⚡ Verb' },
  adj:   { bg: 'rgba(255,107,157,0.25)', color: '#ff6b9d', label: '✨ Adj' },
  phrase:{ bg: 'rgba(255,159,67,0.25)',  color: '#ff9f43', label: '💬 Phrase' },
  adv:   { bg: 'rgba(155,89,182,0.25)',  color: '#c39bd3', label: '🔄 Adverb' },
  num:   { bg: 'rgba(255,217,61,0.25)',  color: '#ffd93d', label: '🔢 Number' },
  day:   { bg: 'rgba(77,150,255,0.2)',   color: '#82c3ff', label: '📅 Day' },
  month: { bg: 'rgba(107,203,119,0.2)',  color: '#82d991', label: '🗓️ Month' },

// ═══════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════
const LIVES = 5;
const WORDS_PER_LEVEL = 10;
const TILE_COLORS = [0, 1, 2, 3]; // c0-c3
const GOAL_WORDS = 1000;

let state = {
  lives: LIVES,
  score: 0,
  streak: 0,
  bestStreak: 0,
  level: 1,
  wordsThisLevel: 0,
  answered: 0,
  correct: 0,
  currentWord: null,
  usedIndices: [],
  locked: false,
  masteredWords: 0,
};

let masteredMap = {};

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('parole_hs') || '{}');
    state.bestStreak = s.bestStreak || 0;
  } catch(e) {}
}
function saveHS() {
  try { localStorage.setItem('parole_hs', JSON.stringify({ bestStreak: state.bestStreak })); } catch(e) {}
}

function loadProgress() {
  try {
    const raw = localStorage.getItem('parole_words') || '{}';
    masteredMap = JSON.parse(raw);
    if (typeof masteredMap !== 'object' || !masteredMap) masteredMap = {};
  } catch (e) {
    masteredMap = {};
  }
  state.masteredWords = Object.keys(masteredMap).length;
}

function saveProgress() {
  try {
    localStorage.setItem('parole_words', JSON.stringify(masteredMap));
  } catch (e) {}
}

// ═══════════════════════════════════════════════
// CONFETTI CANVAS
// ═══════════════════════════════════════════════
const cvs = document.getElementById('confetti');
const ctx = cvs.getContext('2d');
let particles = [];

function resizeCvs() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
resizeCvs();
window.addEventListener('resize', resizeCvs);

function spawnConfetti(x, y, count = 18, colors) {
  const cols = colors || ['#ff6b9d','#ffd93d','#6bcb77','#4d96ff','#ff9f43','#fff'];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 2;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      color: cols[~~(Math.random() * cols.length)],
      size: Math.random() * 6 + 3,
      rot: Math.random() * 360,
      rotV: (Math.random() - 0.5) * 15,
      alpha: 1,
      type: Math.random() > 0.5 ? 'rect' : 'circle',
    });
  }
}

function tickCanvas() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  particles = particles.filter(p => p.alpha > 0.02);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.15; p.alpha -= 0.022;
    p.rot += p.rotV;
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot * Math.PI / 180);
    if (p.type === 'rect') ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
    else { ctx.beginPath(); ctx.arc(0, 0, p.size/2, 0, Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
  requestAnimationFrame(tickCanvas);
}
tickCanvas();

// ═══════════════════════════════════════════════
// FLOATING POINTS
// ═══════════════════════════════════════════════
function floatPoints(pts, x, y, color) {
  const el = document.createElement('div');
  el.className = 'float-pts';
  el.textContent = '+' + pts;
  el.style.cssText = `left:${x}px;top:${y}px;color:${color||'#ffd93d'};text-shadow:0 0 8px ${color||'rgba(255,217,61,0.6)'}`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

// ═══════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = ~~(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderHearts() {
  const el = document.getElementById('heartsEl');
  el.innerHTML = '';
  for (let i = 0; i < LIVES; i++) {
    const h = document.createElement('span');
    h.className = 'heart' + (i >= state.lives ? ' lost' : '');
    h.textContent = '❤️';
    el.appendChild(h);
  }
}

function updateScore() {
  const el = document.getElementById('scoreEl');
  el.textContent = state.score.toLocaleString();
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

function updateStreak() {
  const el = document.getElementById('streakEl');
  const num = document.getElementById('streakNum');
  num.textContent = state.streak;
  el.classList.toggle('hot', state.streak >= 3);
}

function updateLevel() {
  document.getElementById('lvNum').textContent = state.level;
  document.getElementById('lvProgress').textContent = state.wordsThisLevel;
  const pct = (state.wordsThisLevel / WORDS_PER_LEVEL) * 100;
  document.getElementById('lvBar').style.width = pct + '%';
}

function updateGoal() {
  const el = document.getElementById('goalNum');
  if (!el) return;
  const current = state.masteredWords;
  el.textContent = `${current} / ${GOAL_WORDS}`;
}

function speak(text, lang = 'it-IT') {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = 0.82;
  window.speechSynthesis.speak(u);
}
window.speakWord = () => speak(state.currentWord?.[4] || state.currentWord?.[0] || '');

// ═══════════════════════════════════════════════
// PICK NEXT WORD
// ═══════════════════════════════════════════════
function pickWord() {
  // Avoid repeating recent words; reset when all used
  if (state.usedIndices.length >= WORDS.length - 4) state.usedIndices = [];
  let idx;
  do { idx = ~~(Math.random() * WORDS.length); }
  while (state.usedIndices.includes(idx));
  state.usedIndices.push(idx);
  return WORDS[idx];
}

function pickWrongAnswers(correct, count) {
  const pool = WORDS.filter(w => w[1] !== correct[1]);
  return shuffle(pool).slice(0, count);
}

// ═══════════════════════════════════════════════
// RENDER QUESTION
// ═══════════════════════════════════════════════
function renderQuestion(animate = true) {
  state.locked = false;
  const word = pickWord();
  state.currentWord = word;
  const [italian, english, pron, cat, exIT, exEN] = word;

  // Update word card
  const cardInner = document.getElementById('cardInner');
  if (animate) {
    cardInner.classList.add('exit');
    setTimeout(() => {
      fillCard(italian, pron, cat, cardInner);
      cardInner.classList.remove('exit');
      cardInner.classList.add('enter');
      setTimeout(() => cardInner.classList.remove('enter'), 350);
    }, 150);
  } else {
    fillCard(italian, pron, cat, cardInner);
  }

  // Build options: 1 correct + 3 wrong
  const wrongs = pickWrongAnswers(word, 3);
  const options = shuffle([word, ...wrongs]);

  // Render tiles
  const tilesEl = document.getElementById('tilesEl');
  tilesEl.innerHTML = '';
  const colors = shuffle([...TILE_COLORS]);
  options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = `tile c${colors[i]}`;
    // Show Italian choices on tiles
    btn.textContent = opt[0];
    btn.dataset.correct = opt[0] === italian ? '1' : '0';
    btn.onclick = () => handleAnswer(btn, opt[0] === italian, word);
    tilesEl.appendChild(btn);
  });

  // Hide next button
  const nb = document.getElementById('nextBtn');
  nb.classList.remove('visible');
}

function fillCard(italian, pron, cat, cardInner) {
  const style = CAT_STYLE[cat] || CAT_STYLE.noun;
  const badge = document.getElementById('catBadge');
  badge.textContent = style.label;
  badge.style.background = style.bg;
  badge.style.color = style.color;

  // Build sentence with the target word blanked out
  const word = state.currentWord;
  const sentenceIT = word[4]; // e.g. "Vado a casa."
  const sentenceEN = word[5]; // e.g. "I'm going home."
  // Replace the Italian word in the sentence with a blank span
  // Try exact match first, then case-insensitive
  const escaped = italian.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(escaped, 'i');
  const blanked = sentenceIT.replace(regex, `<span class="blank" id="theBlank">___</span>`);

  document.getElementById('sentenceDisplay').innerHTML = blanked;
  document.getElementById('sentenceEn').textContent = '🇬🇧 ' + sentenceEN;
}

// ═══════════════════════════════════════════════
// HANDLE ANSWER
// ═══════════════════════════════════════════════
function handleAnswer(btn, isCorrect, word) {
  if (state.locked) return;
  state.locked = true;
  state.answered++;

  const allTiles = document.querySelectorAll('.tile');
  allTiles.forEach(t => t.disabled = true);

  // Fill the blank in the sentence with the correct word
  const blank = document.getElementById('theBlank');

  if (isCorrect) {
    if (blank) { blank.textContent = word[0]; blank.className = 'blank filled'; }
    // Reveal full English sentence
    const enEl = document.getElementById('sentenceEn');
    if (enEl) enEl.textContent = '🇬🇧 ' + word[5];
    state.correct++;
    state.streak++;
    state.wordsThisLevel++;
    if (state.streak > state.bestStreak) { state.bestStreak = state.streak; saveHS(); }

    // Points: base 100 + streak bonus
    const streakBonus = Math.min(state.streak - 1, 9) * 20;
    const pts = 100 + streakBonus;
    state.score += pts;

    // Mark this word as mastered (first time correct)
    const key = word[0];
    if (!masteredMap[key]) {
      masteredMap[key] = true;
      state.masteredWords = Object.keys(masteredMap).length;
      saveProgress();
      updateGoal();
    }

    btn.classList.add('correct');
    allTiles.forEach(t => { if (t !== btn) t.classList.add('dimmed'); });

    // Confetti burst from button
    const r = btn.getBoundingClientRect();
    spawnConfetti(r.left + r.width/2, r.top + r.height/2, 22);
    floatPoints(pts, r.left + r.width/2 - 20, r.top, '#ffd93d');

    // Combo burst
    if (state.streak >= 3) showComboBurst(state.streak);

    updateScore();
    updateStreak();
    updateLevel();

    // Feedback bubble
    showFeedback(true, word);

    // Auto-advance or show next button
    if (state.wordsThisLevel >= WORDS_PER_LEVEL) {
      setTimeout(() => showLevelUp(), 1000);
    } else {
      // Auto next after short delay
      setTimeout(nextWord, 1200);
    }

    speak(word[4]); // speak full sentence on correct

  } else {
    state.lives--;
    state.streak = 0;

    // Show what the correct word was in the blank
    if (blank) { blank.textContent = word[0]; blank.className = 'blank filled-wrong'; }
    // Reveal full English sentence
    const enEl = document.getElementById('sentenceEn');
    if (enEl) enEl.textContent = '🇬🇧 ' + word[5];

    btn.classList.add('wrong');
    // Reveal correct
    allTiles.forEach(t => {
      if (t.dataset.correct === '1') t.classList.add('reveal-correct');
      else if (t !== btn) t.classList.add('dimmed');
    });

    renderHearts();
    updateStreak();

    // Shake card
    document.getElementById('wordCard').classList.add('shake');
    setTimeout(() => document.getElementById('wordCard').classList.remove('shake'), 500);

    showFeedback(false, word);

    if (state.lives <= 0) {
      setTimeout(showGameOver, 1400);
    } else {
      setTimeout(nextWord, 1600);
    }
  }
}

// ═══════════════════════════════════════════════
// FEEDBACK BUBBLE
// ═══════════════════════════════════════════════
let fbTimer = null;
function showFeedback(correct, word) {
  const overlay = document.getElementById('fbOverlay');
  const correct_msgs = ['Perfetto! 🎉', 'Bravissimo! ⭐', 'Magnifico! 🏆', 'Ottimo! 🔥', 'Esatto! ✨'];
  const wrong_msgs  = ['Non mollare! 💪', 'Riprova! 😤', 'Quasi! 🤏', 'Forza! ⚡'];
  document.getElementById('fbEmoji').textContent = correct
    ? (state.streak >= 5 ? '🔥' : state.streak >= 3 ? '⭐' : '✅')
    : '❌';
  document.getElementById('fbWord').textContent = correct
    ? correct_msgs[~~(Math.random() * correct_msgs.length)]
    : wrong_msgs[~~(Math.random() * wrong_msgs.length)];
  document.getElementById('fbExample').textContent = `"${word[4]}" — ${word[5]}`;

  overlay.classList.add('show');
  clearTimeout(fbTimer);
  fbTimer = setTimeout(() => overlay.classList.remove('show'), correct ? 1000 : 1400);
}

// ═══════════════════════════════════════════════
// COMBO BURST
// ═══════════════════════════════════════════════
const comboMessages = {3:'3x Combo!🔥',4:'4x Sizzling!🔥',5:'5x On Fire!🔥',7:'7x Incredible!💥',10:'10x GODLIKE!👑'};
function showComboBurst(streak) {
  const msg = comboMessages[streak] || (streak + 'x Combo! 🔥');
  if (!comboMessages[streak] && streak % 5 !== 0 && streak < 3) return;
  const el = document.getElementById('comboBurst');
  el.textContent = msg;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 700);
}

// ═══════════════════════════════════════════════
// NEXT WORD
// ═══════════════════════════════════════════════
function nextWord() {
  renderQuestion(true);
}

// ═══════════════════════════════════════════════
// LEVEL UP
// ═══════════════════════════════════════════════
function showLevelUp() {
  state.level++;
  state.wordsThisLevel = 0;
  const overlay = document.getElementById('bigOverlay');
  document.getElementById('bigIcon').textContent = '🏆';
  document.getElementById('bigTitle').textContent = 'Level ' + state.level + '!';
  document.getElementById('bigSub').textContent = 'Fantastico! Keep going — you\'re getting incredible at Italian! 🇮🇹';
  document.getElementById('bigStats').innerHTML = `
    <div class="big-stat"><div class="big-stat-val">${state.score.toLocaleString()}</div><div class="big-stat-lbl">Score</div></div>
    <div class="big-stat"><div class="big-stat-val">${state.streak}</div><div class="big-stat-lbl">Streak</div></div>
    <div class="big-stat"><div class="big-stat-val">${Math.round(state.correct/state.answered*100)||0}%</div><div class="big-stat-lbl">Accuracy</div></div>
  `;
  document.getElementById('bigBtn').textContent = 'Continue! →';
  document.getElementById('bigOverlay').dataset.mode = 'levelup';
  overlay.classList.add('show');
  // Big confetti
  spawnConfetti(window.innerWidth/2, window.innerHeight/3, 60);
  setTimeout(() => spawnConfetti(window.innerWidth/4, window.innerHeight/2, 40), 200);
  setTimeout(() => spawnConfetti(window.innerWidth*3/4, window.innerHeight/2, 40), 400);
}

// ═══════════════════════════════════════════════
// GAME OVER
// ═══════════════════════════════════════════════
function showGameOver() {
  const accuracy = state.answered > 0 ? Math.round(state.correct / state.answered * 100) : 0;
  const overlay = document.getElementById('bigOverlay');
  document.getElementById('bigIcon').textContent = accuracy >= 80 ? '😎' : accuracy >= 50 ? '😅' : '😢';
  document.getElementById('bigTitle').textContent = 'Game Over!';
  document.getElementById('bigSub').textContent = accuracy >= 80
    ? 'Molto bene! You did great!' : accuracy >= 50
    ? 'Bel tentativo! Keep practising!' : 'Non arrenderti — practice makes perfect!';
  document.getElementById('bigStats').innerHTML = `
    <div class="big-stat"><div class="big-stat-val">${state.score.toLocaleString()}</div><div class="big-stat-lbl">Score</div></div>
    <div class="big-stat"><div class="big-stat-val">${state.bestStreak}</div><div class="big-stat-lbl">Best Streak</div></div>
    <div class="big-stat"><div class="big-stat-val">${accuracy}%</div><div class="big-stat-lbl">Accuracy</div></div>
  `;
  document.getElementById('bigBtn').textContent = '🔄 Play Again';
  overlay.dataset.mode = 'gameover';
  overlay.classList.add('show');
}

// ═══════════════════════════════════════════════
// BIG BUTTON HANDLER
// ═══════════════════════════════════════════════
function handleBigBtn() {
  const mode = document.getElementById('bigOverlay').dataset.mode;
  document.getElementById('bigOverlay').classList.remove('show');
  if (mode === 'gameover') {
    resetGame();
  } else {
    // Level up — just continue
    renderQuestion(true);
  }
}
window.handleBigBtn = handleBigBtn;

function resetGame() {
  state.lives = LIVES;
  state.score = 0;
  state.streak = 0;
  state.level = 1;
  state.wordsThisLevel = 0;
  state.answered = 0;
  state.correct = 0;
  state.usedIndices = [];
  renderHearts();
  updateScore();
  updateStreak();
  updateLevel();
  renderQuestion(false);
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
loadState();
loadProgress();
renderHearts();
updateScore();
updateStreak();
updateLevel();
updateGoal();
renderQuestion(false);
</script>
